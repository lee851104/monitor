name: Build iPhone app

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test quota parsing and packaging
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
      - name: Select simulator
        id: simulator
        run: python3 scripts/select_simulator.py
      - name: Compile and test the native app
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          xcodebuild test -project TokenBar.xcodeproj -scheme TokenBar \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/simulator -resultBundlePath build/NativeTests.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned physical-device app
        run: |
          xcodebuild archive -project TokenBar.xcodeproj -scheme TokenBar \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/TokenBar.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          python3 scripts/package_ipa.py \
            build/TokenBar.xcarchive/Products/Applications/TokenBar.app \
            build/TokenBar-unsigned.ipa
          shasum -a 256 build/TokenBar-unsigned.ipa > build/TokenBar-unsigned.sha256
      - name: Capture initial screen (no account data)
        continue-on-error: true
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          xcrun simctl install "$SIMULATOR_ID" build/simulator/Build/Products/Debug-iphonesimulator/TokenBar.app
          xcrun simctl launch "$SIMULATOR_ID" app.personal.tokenbar
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot build/initial-screen.png
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TokenBar-iPhone-unsigned
          path: |
            build/TokenBar-unsigned.ipa
            build/TokenBar-unsigned.sha256
            build/initial-screen.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload native test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TokenBar-native-test-result
          path: build/NativeTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
